version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: emailreminders-postgres
    environment:
      POSTGRES_DB: emailreminders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: emailreminders-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailreminders-app
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/emailreminders
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_SSL_ENABLE: "false"
      JWT_SECRET: your-256-bit-secret-key-here-for-local-development-change-in-production
      APP_BASE_URL: http://localhost:8080
      FROM_EMAIL: noreply@emailreminders.local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_healthy

volumes:
  postgres_data:
