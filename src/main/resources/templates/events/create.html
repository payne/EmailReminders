<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Email Reminders'">Create Event - Email Reminders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <nav class="nav-container">
            <a th:href="@{/}" class="logo">Email Reminders</a>
            <div class="nav-links">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/groups}">Groups</a>
                <a th:href="@{/events}" class="active">Events</a>
                <a th:href="@{/profile}">Profile</a>
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="btn-link">Logout</button>
                </form>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="card" style="max-width: 700px;">
            <h1 class="card-title mb-3">Create New Event</h1>

            <form th:action="@{/events}" method="post">
                <div class="form-group">
                    <label for="title" class="form-label">Event Title *</label>
                    <input type="text" id="title" name="title" class="form-control"
                           placeholder="Team Meeting, Birthday, Deadline..." required>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" name="description" class="form-control"
                              rows="3" placeholder="Optional details about the event"></textarea>
                </div>

                <div class="grid grid-2">
                    <div class="form-group">
                        <label for="eventTime" class="form-label">Date & Time *</label>
                        <input type="datetime-local" id="eventTime" name="eventTime" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="timezone" class="form-label">Timezone *</label>
                        <select id="timezone" name="timezone" class="form-control" required>
                            <option value="America/New_York">Eastern Time (US)</option>
                            <option value="America/Chicago">Central Time (US)</option>
                            <option value="America/Denver">Mountain Time (US)</option>
                            <option value="America/Los_Angeles">Pacific Time (US)</option>
                            <option value="Europe/London">London</option>
                            <option value="Europe/Paris">Paris</option>
                            <option value="Asia/Tokyo">Tokyo</option>
                            <option value="UTC">UTC</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reminderMinutesBefore" class="form-label">Remind me</label>
                    <select id="reminderMinutesBefore" name="reminderMinutesBefore" class="form-control">
                        <option value="15">15 minutes before</option>
                        <option value="30">30 minutes before</option>
                        <option value="60" selected>1 hour before</option>
                        <option value="120">2 hours before</option>
                        <option value="1440">1 day before</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="form-check">
                        <input type="checkbox" id="isRecurring" name="isRecurring" value="true"
                               onchange="toggleRecurrenceOptions()">
                        <label for="isRecurring">This is a recurring event</label>
                    </div>
                </div>

                <div id="recurrenceOptions" style="display: none;">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label for="recurrencePattern" class="form-label">Repeat</label>
                            <select id="recurrencePattern" name="recurrencePattern" class="form-control">
                                <option th:each="pattern : ${recurrencePatterns}"
                                        th:value="${pattern}" th:text="${pattern}">DAILY</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="recurrenceInterval" class="form-label">Every</label>
                            <input type="number" id="recurrenceInterval" name="recurrenceInterval"
                                   class="form-control" value="1" min="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="recurrenceEndDate" class="form-label">End Date (optional)</label>
                        <input type="date" id="recurrenceEndDate" name="recurrenceEndDate" class="form-control">
                    </div>
                </div>

                <div th:if="${!#lists.isEmpty(groups)}" class="form-group">
                    <label class="form-label">Add to Groups</label>
                    <div th:each="group : ${groups}" class="form-check">
                        <input type="checkbox" th:id="'group-' + ${group.id}" name="groupIds"
                               th:value="${group.id}">
                        <label th:for="'group-' + ${group.id}" th:text="${group.name}">Group Name</label>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <button type="submit" class="btn btn-primary">Create Event</button>
                    <a th:href="@{/events}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2024 Email Reminders</p>
    </footer>

    <script>
        function toggleRecurrenceOptions() {
            var checkbox = document.getElementById('isRecurring');
            var options = document.getElementById('recurrenceOptions');
            options.style.display = checkbox.checked ? 'block' : 'none';
        }
    </script>
</body>
</html>
