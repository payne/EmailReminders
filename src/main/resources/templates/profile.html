<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Email Reminders'">Profile - Email Reminders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <nav class="nav-container">
            <a th:href="@{/}" class="logo">Email Reminders</a>
            <div class="nav-links">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/groups}">Groups</a>
                <a th:href="@{/events}">Events</a>
                <a th:href="@{/profile}" class="active">Profile</a>
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="btn-link">Logout</button>
                </form>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="card" style="max-width: 600px;">
            <h1 class="card-title mb-3">Profile Settings</h1>

            <form th:action="@{/profile}" method="post">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" th:value="${user.email}" disabled>
                    <small class="form-text">Email cannot be changed</small>
                </div>

                <div class="form-group">
                    <label for="displayName" class="form-label">Display Name</label>
                    <input type="text" id="displayName" name="displayName" class="form-control"
                           th:value="${user.displayName}" placeholder="Your name">
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>

        <div class="card mt-3" style="max-width: 600px;">
            <h2 class="card-title mb-2">Account Info</h2>
            <p><strong>Email Verified:</strong>
                <span th:if="${user.emailVerified}" class="badge badge-success">Yes</span>
                <span th:unless="${user.emailVerified}" class="badge badge-warning">No</span>
            </p>
            <p><strong>Member Since:</strong>
                <span th:text="${#temporals.format(user.createdAt, 'MMMM d, yyyy')}">January 1, 2024</span>
            </p>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2024 Email Reminders</p>
    </footer>
</body>
</html>
