<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Email Reminders'">Action Result - Email Reminders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <nav class="nav-container">
            <a th:href="@{/}" class="logo">Email Reminders</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="auth-container">
            <div class="auth-card text-center">
                <div th:if="${success}">
                    <div style="font-size: 4rem; color: #10b981; margin-bottom: 1rem;">&#10003;</div>
                    <h1 class="auth-title">Success!</h1>
                    <p class="mb-2" th:text="${message}">Action completed</p>
                    <p class="text-muted">Event: <strong th:text="${eventTitle}">Event Title</strong></p>
                </div>

                <div th:unless="${success}">
                    <div style="font-size: 4rem; color: #ef4444; margin-bottom: 1rem;">&#10007;</div>
                    <h1 class="auth-title">Oops!</h1>
                    <p class="text-muted" th:text="${message}">Something went wrong</p>
                </div>

                <div class="mt-3">
                    <a th:href="@{/dashboard}" class="btn btn-primary">Go to Dashboard</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2024 Email Reminders</p>
    </footer>
</body>
</html>
