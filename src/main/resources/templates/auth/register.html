<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Email Reminders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <nav class="nav-container">
            <a th:href="@{/}" class="logo">Email Reminders</a>
            <div class="nav-links">
                <a th:href="@{/login}">Login</a>
                <a th:href="@{/register}" class="active">Register</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="auth-container">
            <div class="auth-card">
                <h1 class="auth-title">Create Account</h1>

                <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

                <form th:action="@{/register}" method="post">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="you@example.com" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="displayName" class="form-label">Display Name (Optional)</label>
                        <input type="text" id="displayName" name="displayName" class="form-control"
                               placeholder="John Doe">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Create Account
                    </button>
                </form>

                <p class="text-center text-muted mt-3">
                    Already have an account? <a th:href="@{/login}">Sign in</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2024 Email Reminders</p>
    </footer>
</body>
</html>
