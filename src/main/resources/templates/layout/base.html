<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ? ${pageTitle} + ' - Email Reminders' : 'Email Reminders'">Email Reminders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <nav class="nav-container">
            <a th:href="@{/}" class="logo">Email Reminders</a>
            <div class="nav-links" sec:authorize="isAuthenticated()">
                <a th:href="@{/dashboard}" th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">Dashboard</a>
                <a th:href="@{/groups}" th:classappend="${currentPage == 'groups'} ? 'active' : ''">Groups</a>
                <a th:href="@{/events}" th:classappend="${currentPage == 'events'} ? 'active' : ''">Events</a>
                <a th:href="@{/profile}" th:classappend="${currentPage == 'profile'} ? 'active' : ''">Profile</a>
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="btn-link">Logout</button>
                </form>
            </div>
            <div class="nav-links" sec:authorize="isAnonymous()">
                <a th:href="@{/login}">Login</a>
                <a th:href="@{/register}">Register</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div th:replace="${content}">
            <!-- Page content will be inserted here -->
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2024 Email Reminders</p>
    </footer>
</body>
</html>
