spring:
  application:
    name: EmailReminders

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/emailreminders}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 25
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.fastmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          starttls:
            enable: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  from-email: ${FROM_EMAIL:noreply@example.com}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-for-development-only-change-in-production}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

magic-link:
  expiration-minutes: 15

action-token:
  expiration-hours: 168

reminder:
  check-interval-ms: 60000
  default-minutes-before: 60

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
