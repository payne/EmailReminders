spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 3025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          ssl:
            enable: false

app:
  base-url: http://localhost:8080
  from-email: test@example.com

jwt:
  secret: test-secret-key-for-testing-purposes-only-256-bits-minimum
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

magic-link:
  expiration-minutes: 15

action-token:
  expiration-hours: 168

reminder:
  check-interval-ms: 60000
  default-minutes-before: 60

management:
  health:
    mail:
      enabled: false
